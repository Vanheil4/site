<style>

html, body {
margin: 0; padding: 0;
background: #000;
overflow: hidden;
font-family: 'Courier New', Courier, monospace;
color: #44ff44;
width: 100%; height: 100%;

-ms-text-size-adjust: 100%;
touch-action: none;

-webkit-user-select: none;

canvas {

word-wrap: break-word;
}
#diaryContent .sys { color: #44ffff; }
#diaryContent .warn { color: #ffaa44; }
#diaryContent .err { color: #ff4444; }
#diaryContent .lore { color: #ffcc44; }
#diaryContent .quest { color: #44ff44; }
#diaryContent .hint { color: #88aaff; }
#diaryToggle {
position: fixed;
bottom: 10px; right: 10px;
padding: 8px 14px;
background: rgba(0,30,0,0.85);
border: 1px solid #44ff44;
-webkit-border-radius: 2px; border-radius: 2px;
color: #44ff44;
font-family: 'Courier New', Courier, monospace;
font-size: 12px;
cursor: pointer;
z-index: 14;
pointer-events: auto;
-webkit-user-select: none; user-select: none;
touch-action: manipulation;
padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
padding-right: calc(14px + env(safe-area-inset-right, 0px));

}
#diaryToggle.visible { display: block; }
#diaryToggle.hasNew {
border-color: #ffcc44;

-webkit-animation: pulse 1.5s infinite;
animation: pulse 1.5s infinite;
}
@-webkit-keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
#mobileControls {
display: none;

<script>
(function(){
'use strict';
window.requestAnimationFrame = window.requestAnimationFrame ||
window.webkitRequestAnimationFrame ||
window.mozRequestAnimationFrame ||
window.msRequestAnimationFrame ||
function(cb){ return window.setTimeout(function(){ cb(Date.now()); }, 1000/60); };
window.cancelAnimationFrame = window.cancelAnimationFrame ||
window.webkitCancelAnimationFrame ||
window.mozCancelAnimationFrame ||
window.msCancelAnimationFrame ||
function(id){ window.clearTimeout(id); };
if (!Math.hypot) {
Math.hypot = function() {
var y = 0, i = arguments.length;
while (i--) y += arguments[i] * arguments[i];
return Math.sqrt(y);
};
}
if (!Array.from) {
Array.from = function(obj, mapFn) {
var arr = [], len = obj.length >>> 0, i;
for (i = 0; i < len; i++) {
if (i in obj) arr.push(mapFn ? mapFn(obj[i], i) : obj[i]);
}
return arr;
};
}
if (!Array.prototype.includes) {
Array.prototype.includes = function(v) {
for (var i = 0; i < this.length; i++) if (this[i] === v) return true;
return false;
};
}
if (!String.prototype.includes) {
String.prototype.includes = function(s, p) {
return this.indexOf(s, p) !== -1;
};
}
if (!Number.isFinite) {
Number.isFinite = function(v) { return typeof v === 'number' && isFinite(v); };
}
var cvs = document.getElementById('game');
var ctx = cvs.getContext('2d', { alpha: false, desynchronized: true }) ||
cvs.getContext('2d');
if (!ctx) {
document.body.innerHTML = '<div style="color:#ff4444;padding:20px;font-family:monospace">Ваш браузер не поддерживает Canvas 2D.</div>';
throw new Error('Canvas 2D not supported');
}
var diaryEl = document.getElementById('diary');
var diaryContent = document.getElementById('diaryContent');
var diaryToggle = document.getElementById('diaryToggle');

diaryToggle.addEventListener('click', function(){ toggleDiary(); });
diaryToggle.addEventListener('touchstart', function(e){ if(e.preventDefault) e.preventDefault(); toggleDiary(); }, {passive:false});

diaryEl.addEventListener('click', function(){
if(diaryEl.classList.contains('expanded')){
diaryEl.classList.remove('expanded');
} else {
diaryEl.classList.add('expanded');
diaryToggle.classList.remove('hasNew');
state.diaryUnread = false;
}
renderDiary(); // Перерисовываем при клике, чтобы показать всю историю
});

function toggleDiary(){
if(!state.storyMode) return;
if(diaryEl.classList.contains('expanded')){
diaryEl.classList.remove('expanded');
} else {
diaryEl.classList.add('expanded');
diaryToggle.classList.remove('hasNew');
state.diaryUnread = false;
}
renderDiary(); // Ключевой фикс: обновляем контент при открытии/закрытии
}

function diaryLog(text, type){
if(!state.storyMode) return;
type = type || 'sys';
var time = '['+String(Math.floor(state.time/60)).padStart(2,'0')+':'+String(Math.floor(state.time%60)).padStart(2,'0')+']';
var entry = { time: time, text: text, type: type };
state.diary.push(entry);
if(state.diary.length > 200) state.diary.shift(); // Увеличил лимит, чтобы история точно сохранялась
renderDiary();
if(!diaryEl.classList.contains('expanded')){
diaryToggle.classList.add('hasNew');
state.diaryUnread = true;
}
}

function renderDiary(){
var html = '';
// Если развернуто - показываем всё, если свернуто - последние 3 сообщения
var startIdx = Math.max(0, state.diary.length - (diaryEl.classList.contains('expanded') ? state.diary.length : 3));
for(var i=startIdx; i<state.diary.length; i++){
var e = state.diary[i];
html += '<span class="sys">'+e.time+'</span> <span class="'+e.type+'">'+e.text+'</span>\n';
}
diaryContent.innerHTML = html;
if(diaryEl.classList.contains('expanded')) {
diaryEl.scrollTop = diaryEl.scrollHeight;
}
}

function drawEllipse(ctx, x, y, rx, ry, rot, a0, a1, ccw) {
if (ctx.ellipse) {
ctx.ellipse(x, y, rx, ry, rot || 0, a0 || 0, a1 || Math.PI * 2, !!ccw);
return;
}
ctx.save();
ctx.translate(x, y);
if (rot) ctx.rotate(rot);
ctx.scale(1, ry / rx);
ctx.arc(0, 0, rx, a0 || 0, a1 || Math.PI * 2, !!ccw);
ctx.restore();
}
function lightenColor(hex, amount){
if(!hex || hex.length < 7) return hex;
var r = parseInt(hex.substr(1,2), 16);
var g = parseInt(hex.substr(3,2), 16);
var b = parseInt(hex.substr(5,2), 16);
r = Math.min(255, Math.floor(r + (255-r)*amount));
g = Math.min(255, Math.floor(g + (255-g)*amount));
b = Math.min(255, Math.floor(b + (255-b)*amount));
return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
function darkenColor(hex, amount){
if(!hex || hex.length < 7) return hex;
var r = parseInt(hex.substr(1,2), 16);
var g = parseInt(hex.substr(3,2), 16);
var b = parseInt(hex.substr(5,2), 16);
r = Math.max(0, Math.floor(r * (1-amount)));
g = Math.max(0, Math.floor(g * (1-amount)));
b = Math.max(0, Math.floor(b * (1-amount)));
return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
var ui = document.getElementById('ui');
var msg = document.getElementById('msg');
var W, H;
function resize() {
W = cvs.width = window.innerWidth || document.documentElement.clientWidth;
H = cvs.height = window.innerHeight || document.documentElement.clientHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
var WORLD = 12000;
var WARP_WORLD = 4000;
var WARP_SCALE = WORLD / WARP_WORLD;
var keys = {};
var gameStarted = false;
var menuPhase = 'modeSelect';
var isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
function keyCodeToCode(e) {
if (e.code) return e.code;
var k = e.key || '';
var map = {
' ':'Space','ArrowUp':'ArrowUp','ArrowDown':'ArrowDown',
'ArrowLeft':'ArrowLeft','ArrowRight':'ArrowRight',
'w':'KeyW','W':'KeyW','a':'KeyA','A':'KeyA',
's':'KeyS','S':'KeyS','d':'KeyD','D':'KeyD',
'q':'KeyQ','Q':'KeyQ','e':'KeyE','E':'KeyE',
'f':'KeyF','F':'KeyF','m':'KeyM','M':'KeyM',
'j':'KeyJ','J':'KeyJ',
'1':'Digit1','2':'Digit2','3':'Digit3'
};
return map[k] || ('Key' + k.toUpperCase());
}
function handleKeyDown(e) {
var code = keyCodeToCode(e);
if(menuPhase === 'modeSelect'){
if(code === 'Digit1'){ startGame(false); return false; }
if(code === 'Digit2'){ startGame(true); return false; }
return false;
}
gameStarted = true;
keys[code] = true;
if(code === 'KeyJ'){
keys['KeyJ'] = false;
toggleDiary();
return false;
}
if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(code) !== -1) {
if (e.preventDefault) e.preventDefault();
}
if (e.stopPropagation) e.stopPropagation();
return false;
}
function handleKeyUp(e) {
keys[keyCodeToCode(e)] = false;
}
if (window.addEventListener) {
window.addEventListener('keydown', handleKeyDown, false);
window.addEventListener('keyup', handleKeyUp, false);
} else {
document.onkeydown = handleKeyDown;
document.onkeyup = handleKeyUp;
}
var mBtns = document.querySelectorAll('.mBtn');
for (var bi = 0; bi < mBtns.length; bi++) {
(function(btn){
var k = btn.getAttribute('data-key');
function start(e){ if(e.preventDefault) e.preventDefault(); keys[k] = true; gameStarted = true; }
function end(e){ if(e.preventDefault) e.preventDefault(); keys[k] = false; }
btn.addEventListener('touchstart', start, {passive:false});
btn.addEventListener('touchend', end, {passive:false});
btn.addEventListener('touchcancel', end, {passive:false});
btn.addEventListener('mousedown', start);
btn.addEventListener('mouseup', end);
btn.addEventListener('mouseleave', end);
})(mBtns[bi]);
}
document.addEventListener('gesturestart', function(e){ if(e.preventDefault) e.preventDefault(); });
document.addEventListener('touchmove', function(e){ if(e.preventDefault) e.preventDefault(); }, {passive:false});
cvs.addEventListener('click', function(e){
if(menuPhase === 'modeSelect'){
var rect = cvs.getBoundingClientRect();
var mx = e.clientX - rect.left;
var my = e.clientY - rect.top;
var btnW = 340, btnH = 80, gap = 30;
var totalW = btnW*2 + gap;
var startX = (W - totalW)/2;
var btnY = H/2 - 20;
if(mx >= startX && mx <= startX+btnW && my >= btnY && my <= btnY+btnH){
startGame(false);
} else if(mx >= startX+btnW+gap && mx <= startX+btnW*2+gap && my >= btnY && my <= btnY+btnH){
startGame(true);
}
}
});
function startGame(withStory){
menuPhase = 'playing';
state.storyMode = withStory;
gameStarted = true;
if(withStory){
diaryEl.classList.add('visible');
diaryToggle.classList.add('visible');
diaryLog('СИСТЕМА ОНЛАЙН. Инициализация боевых протоколов...', 'sys');
diaryLog('Капитан Титькин, сын Императора, вступает в командование.', 'lore');
diaryLog('Сектор заражён еретиками Хаоса и ксеносами.', 'warn');
diaryLog('ЗАДАНИЕ: удерживать Терру. Захватывать планеты Империумом.', 'quest');
diaryLog('ПОДСКАЗКА: используйте варп-разломы для быстрого перемещения [Q].', 'hint');
diaryLog('ВНИМАНИЕ: в случае гибели — экстренная телепортация к Астрономикону.', 'sys');
} else {
diaryEl.classList.remove('visible');
diaryToggle.classList.remove('visible');
}
}
var UPGRADES = [

{ id:'en1', name:'Реактор', desc:'+60 макс. энергии', icon:'⚡', color:'#44ffff', apply: function(p){ p.maxEnergy += 60; p.energy += 60; }},
{ id:'en2', name:'Мощный реактор', desc:'+120 макс. энергии', icon:'⚡⚡', color:'#44ffff', apply: function(p){ p.maxEnergy += 120; p.energy += 120; }},
{ id:'rg1', name:'Ускор. регенерация', desc:'+50% реген энергии', icon:'🔄', color:'#88ff88', apply: function(p){ p.energyRegen *= 1.5; }},
{ id:'rg2', name:'Двойная регенерация', desc:'+100% реген энергии', icon:'🔄🔄', color:'#88ff88', apply: function(p){ p.energyRegen *= 2; }},
{ id:'sp1', name:'Маневровые двигатели', desc:'+20% скорости', icon:'»', color:'#ffff44', apply: function(p){ p.speed *= 1.2; }},
{ id:'sp2', name:'Ускорители', desc:'+40% скорости', icon:'»»', color:'#ffff44', apply: function(p){ p.speed *= 1.4; }},
{ id:'dm1', name:'Пробивные заряды', desc:'+25% урона', icon:'↑', color:'#ff8844', apply: function(p){ p.dmgMult = (p.dmgMult || 1) * 1.25; }},
{ id:'dm2', name:'Тяжёлые снаряды', desc:'+50% урона', icon:'↑↑', color:'#ff8844', apply: function(p){ p.dmgMult = (p.dmgMult || 1) * 1.5; }},
{ id:'fr1', name:'Автозагрузчик', desc:'-25% кулдауна', icon:'⚙', color:'#ffaa44', apply: function(p){ p.fireRateMult = (p.fireRateMult || 1) * 0.75; }},
{ id:'fr2', name:'Скорострел', desc:'-40% кулдауна', icon:'⚙⚙', color:'#ffaa44', apply: function(p){ p.fireRateMult = (p.fireRateMult || 1) * 0.6; }},
{ id:'sh1', name:'Усиленный щит', desc:'+80 макс. щита', icon:'◉', color:'#4488ff', apply: function(p){ p.maxShield = (p.maxShield||0) + 80; p.shield = (p.shield||0) + 80; }},
{ id:'sh2', name:'Мощный щит', desc:'+160 макс. щита', icon:'◉◉', color:'#4488ff', apply: function(p){ p.maxShield = (p.maxShield||0) + 160; p.shield = (p.shield||0) + 160; }},
{ id:'sr1', name:'Быстрый щит', desc:'+100% реген щита', icon:'◎', color:'#88aaff', apply: function(p){ p.shieldRegen = (p.shieldRegen || 0.05) * 2; }},

{ id:'al1', name:'Подкрепление', desc:'+1 союзный корабль', icon:'✦', color:'#44aaff',

state.allies.push({

},

function updateWarpChaos(){
if(!state.warpMode) {
state.warpChaosLevel = Math.max(0, state.warpChaosLevel - 0.02);

}
state.warpChaosLevel = Math.min(1, state.warpChaosLevel + 0.003);
var p = state.player;
if(Math.random() < 0.005 * (1 + state.warpChaosLevel)){
var a = Math.random()*Math.PI*2;

spawnWarpVortex(p.x + Math.cos(a)*d, p.y + Math.sin(a)*d);
}
if(Math.random() < 0.02 * (1 + state.warpChaosLevel)){
var targets = state.warpEntities.filter(function(e){return e.alive;}).concat(state.warpDemons.filter(function(e){return e.alive;}));
if(targets.length >= 2){
var t1 = targets[Math.floor(Math.random()*targets.length)];
var t2 = targets[Math.floor(Math.random()*targets.length)];
if(t1 !== t2 && dist(t1, t2) < 600){
spawnWarpLightning(t1.x, t1.y, t2.x, t2.y);
}
}
}
if(Math.random() < 0.003 * (1 + state.warpChaosLevel * 2) && state.warpGhosts.length < 5){
var a = Math.random()*Math.PI*2;
var d = rand(600, 1000);
spawnWarpGhost(p.x + Math.cos(a)*d, p.y + Math.sin(a)*d);
}
if(Math.random() < 0.05 * (1 + state.warpChaosLevel * 3)){
addWarpGlitch();
}
for(var i=state.warpVortices.length-1; i>=0; i--){
var v = state.warpVortices[i];
v.life--;
v.phase += v.rotSpeed;
if(v.life <= 0){
state.warpVortices.splice(i, 1);
continue;
}
var d = dist(p, v);
if(d < v.r * 2 && d > 5){
var a = Math.atan2(v.y - p.y, v.x - p.x);
var force = v.strength * (1 - d/(v.r*2));
p.vx += Math.cos(a) * force;
p.vy += Math.sin(a) * force;
p.vx += Math.cos(a + Math.PI/2) * force * 0.5;
p.vy += Math.sin(a + Math.PI/2) * force * 0.5;
}
for(var j=0; j<state.warpEntities.length; j++){
var e = state.warpEntities[j];
if(!e.alive) continue;
var d2 = dist(e, v);
if(d2 < v.r * 2 && d2 > 5){
var a = Math.atan2(v.y - e.y, v.x - e.x);
e.vx += Math.cos(a) * v.strength * 0.5;
e.vy += Math.sin(a) * v.strength * 0.5;
}
}
}
for(var i=state.warpLightning.length-1; i>=0; i--){
state.warpLightning[i].life--;
if(state.warpLightning[i].life <= 0){
state.warpLightning.splice(i, 1);
}
}
for(var i=state.warpGhosts.length-1; i>=0; i--){
var g = state.warpGhosts[i];
if(!g.alive){ state.warpGhosts.splice(i, 1); continue; }
g.life--;
if(g.life <= 0){
g.alive = false;
state.warpGhosts.splice(i, 1);
for(var j=0; j<15; j++) particle(g.x, g.y, '#aa44ff', 30, 3);
continue;
}
g.phase += 0.08;
var a = Math.atan2(p.y - g.y, p.x - g.x);
var d = dist(g, p);
g.angle = a;
if(d > 150){
g.vx += Math.cos(a) * 0.08;
g.vy += Math.sin(a) * 0.08;
}
g.vx *= 0.95; g.vy *= 0.95;
var sp = Math.hypot(g.vx, g.vy);
if(sp > 2.5){ g.vx = (g.vx/sp)*2.5; g.vy = (g.vy/sp)*2.5; }
g.x += g.vx; g.y += g.vy;
if(d < 600){
g.fireCd--;
if(g.fireCd <= 0){
shoot({x:g.x+Math.cos(a)*g.size, y:g.y+Math.sin(a)*g.size},
a + rand(-0.2, 0.2), 5, 15, 'enemy', '#aa44ff', 0, true);
g.fireCd = 70;
}
}
}
for(var i=state.warpGlitches.length-1; i>=0; i--){
state.warpGlitches[i].life--;
if(state.warpGlitches[i].life <= 0){
state.warpGlitches.splice(i, 1);
}
}
}

function drawPlayerShield(x, y, size, energy, maxEnergy, shield, maxShield){
var hasEnergy = energy > 0;
var hasShield = maxShield > 0 && shield > 0;
if(!hasEnergy && !hasShield) return;
var p = state.player;
var flash = p.shieldFlash > 0 ? p.shieldFlash / 15 : 0;
if(hasEnergy){
var energyPct = energy / maxEnergy;
var pulse = 1 + Math.sin(state.time * 0.1) * 0.04;
var shieldRadius = size * 1.4 * pulse;
ctx.save();
var glowG = ctx.createRadialGradient(x, y, shieldRadius*0.8, x, y, shieldRadius*1.3);
glowG.addColorStop(0, 'rgba(100,255,200,0)');
glowG.addColorStop(0.7, 'rgba(100,255,200,'+(0.05 + energyPct * 0.1 + flash * 0.3)+')');
glowG.addColorStop(1, 'rgba(100,255,200,0)');
ctx.fillStyle = glowG;
ctx.beginPath();
ctx.arc(x, y, shieldRadius*1.3, 0, Math.PI*2);
ctx.fill();
ctx.globalAlpha = 0.3 + energyPct * 0.3 + flash * 0.5;
ctx.strokeStyle = '#44ffcc';
ctx.lineWidth = 1.5;
if(SHADOW_ENABLED){ ctx.shadowColor = '#44ffcc'; ctx.shadowBlur = 8 + flash * 15; }
var hexSize = 8;
var rings = 3;
for(var ring=1; ring<=rings; ring++){
var ringR = shieldRadius * (ring/rings) * 0.9;
var hexCount = Math.floor(ring * 6);
for(var i=0; i<hexCount; i++){
var a = (i/hexCount) * Math.PI*2 + state.time * 0.01 * (ring%2===0?1:-1);
var hx = x + Math.cos(a) * ringR;
var hy = y + Math.sin(a) * ringR;
ctx.beginPath();
for(var j=0; j<6; j++){
var ha = (j/6)*Math.PI*2;
var px = hx + Math.cos(ha) * hexSize * 0.5;
var py = hy + Math.sin(ha) * hexSize * 0.5;
if(j===0) ctx.moveTo(px, py);
else ctx.lineTo(px, py);
}
ctx.closePath();
ctx.stroke();
}
}
ctx.globalAlpha = 0.5 + energyPct * 0.4 + flash * 0.5;
ctx.strokeStyle = '#88ffee';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(x, y, shieldRadius, 0, Math.PI*2);
ctx.stroke();
ctx.globalAlpha = 0.8;
for(var i=0; i<6; i++){
var a = (i/6)*Math.PI*2 + state.time * 0.03;
var sx = x + Math.cos(a) * shieldRadius;
var sy = y + Math.sin(a) * shieldRadius;
ctx.fillStyle = '#ffffff';
if(SHADOW_ENABLED){ ctx.shadowColor = '#44ffcc'; ctx.shadowBlur = 10; }
ctx.beginPath();
ctx.arc(sx, sy, 1.5, 0, Math.PI*2);
ctx.fill();
}
ctx.restore();
}
if(hasShield){
var pct = shield / maxShield;
var pulse = 1 + Math.sin(state.time * 0.08) * 0.05;
ctx.save();
ctx.globalAlpha = 0.3 + pct * 0.4;
ctx.strokeStyle = '#4488ff';
ctx.lineWidth = 2 + pct * 2;
if(SHADOW_ENABLED){ ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 10 + pct * 10; }
ctx.beginPath();
ctx.arc(x, y, size * 1.6 * pulse, 0, Math.PI*2);
ctx.stroke();
ctx.globalAlpha = 0.05 + pct * 0.15;
ctx.fillStyle = '#4488ff';
ctx.beginPath();
ctx.arc(x, y, size * 1.6 * pulse, 0, Math.PI*2);
ctx.fill();
ctx.restore();
}
}
function drawShield(x, y, size, shield, maxShield, color){
if(!maxShield || maxShield <= 0 || shield <= 0) return;
var pct = shield / maxShield;
var pulse = 1 + Math.sin(state.time * 0.08) * 0.05;
ctx.save();
ctx.globalAlpha = 0.3 + pct * 0.4;
ctx.strokeStyle = color;
ctx.lineWidth = 2 + pct * 2;
if(SHADOW_ENABLED){ ctx.shadowColor = color; ctx.shadowBlur = 10 + pct * 10; }
ctx.beginPath();
ctx.arc(x, y, size * 1.2 * pulse, 0, Math.PI*2);
ctx.stroke();
ctx.globalAlpha = 0.05 + pct * 0.15;
ctx.fillStyle = color;
ctx.beginPath();
ctx.arc(x, y, size * 1.2 * pulse, 0, Math.PI*2);
ctx.fill();
var segments = 8;
var activeSegments = Math.ceil(segments * pct);
ctx.globalAlpha = 0.5;
ctx.strokeStyle = color;
ctx.lineWidth = 1;
for(var i=0; i<activeSegments; i++){
var a1 = (i/segments)*Math.PI*2 + state.time*0.02;
var a2 = a1 + Math.PI*2/segments * 0.7;
ctx.beginPath();
ctx.arc(x, y, size * 1.25 * pulse, a1, a2);
ctx.stroke();
}
ctx.restore();
}

function drawWarpChaos(ox, oy){
for(var i=0; i<state.warpVortices.length; i++){
var v = state.warpVortices[i];
var sx = v.x + ox, sy = v.y + oy;
if(sx < -v.r*2 || sx > W+v.r*2 || sy < -v.r*2 || sy > H+v.r*2) continue;
var lifePct = v.life / v.maxLife;
var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, v.r*2);
g.addColorStop(0, 'rgba(150,0,200,'+(0.3*lifePct)+')');
g.addColorStop(0.5, 'rgba(100,0,150,'+(0.15*lifePct)+')');
g.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = g;
ctx.beginPath();
ctx.arc(sx, sy, v.r*2, 0, Math.PI*2);
ctx.fill();
ctx.strokeStyle = 'rgba(200,100,255,'+(0.6*lifePct)+')';
ctx.lineWidth = 2;
if(SHADOW_ENABLED){ ctx.shadowColor = '#ff44ff'; ctx.shadowBlur = 10; }
for(var arm=0; arm<3; arm++){
ctx.beginPath();
var armOffset = (arm/3)*Math.PI*2;
for(var t=0; t<30; t++){
var tt = t/30;
var r = v.r * tt;
var a = v.phase + armOffset + tt * Math.PI * 4;
var px = sx + Math.cos(a) * r;
var py = sy + Math.sin(a) * r;
if(t===0) ctx.moveTo(px, py);
else ctx.lineTo(px, py);
}
ctx.stroke();
}
ctx.shadowBlur = 0;
ctx.fillStyle = 'rgba(255,200,255,'+lifePct+')';
if(SHADOW_ENABLED){ ctx.shadowColor = '#ff88ff'; ctx.shadowBlur = 20; }
ctx.beginPath();
ctx.arc(sx, sy, 5 + Math.sin(state.time*0.2)*2, 0, Math.PI*2);
ctx.fill();
ctx.shadowBlur = 0;
}
for(var i=0; i<state.warpLightning.length; i++){
var l = state.warpLightning[i];
var lifePct = l.life / l.maxLife;
ctx.strokeStyle = l.color;
ctx.lineWidth = 3 * lifePct;
if(SHADOW_ENABLED){ ctx.shadowColor = l.color; ctx.shadowBlur = 20 * lifePct; }
ctx.globalAlpha = lifePct;
ctx.beginPath();
for(var j=0; j<l.segments.length; j++){
var s = l.segments[j];
var sx = s.x + ox, sy = s.y + oy;
if(j===0) ctx.moveTo(sx, sy);
else ctx.lineTo(sx, sy);
}
ctx.stroke();
ctx.strokeStyle = '#ffffff';
ctx.lineWidth = 1 * lifePct;
ctx.beginPath();
for(var j=0; j<l.segments.length; j++){
var s = l.segments[j];
var sx = s.x + ox, sy = s.y + oy;
if(j===0) ctx.moveTo(sx, sy);
else ctx.lineTo(sx, sy);
}
ctx.stroke();
ctx.globalAlpha = 1;
ctx.shadowBlur = 0;
}
for(var i=0; i<state.warpGlitches.length; i++){
var g = state.warpGlitches[i];
var lifePct = g.life / g.maxLife;
ctx.save();
ctx.globalAlpha = lifePct * 0.6;
ctx.fillStyle = g.color;
ctx.fillRect(0, g.y, W, g.h);
ctx.globalCompositeOperation = 'difference';
ctx.fillStyle = '#ffffff';
ctx.fillRect(g.offset, g.y, W, g.h * 0.3);
ctx.restore();
}
}
function drawWarpBackground(){
var t = state.time * 0.005;
var chaos = state.warpChaosLevel;
var bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H));
bg.addColorStop(0, 'rgba('+(60+chaos*40)+',0,'+(80+chaos*30)+',1)');
bg.addColorStop(0.5, 'rgba('+(30+chaos*20)+',0,'+(50+chaos*20)+',1)');
bg.addColorStop(1, '#0a0010');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);
ctx.save();
ctx.globalAlpha = 0.15 + chaos * 0.1;
for(var i=0; i<5; i++){
var cx = W/2 + Math.cos(t + i*1.3) * 200;
var cy = H/2 + Math.sin(t*0.7 + i*1.7) * 200;
var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 400);
var hue = (i * 60 + state.time) % 360;
g.addColorStop(0, 'hsla('+(280+i*20)+', 100%, 50%, 0.3)');
g.addColorStop(1, 'transparent');
ctx.fillStyle = g;
ctx.beginPath();
ctx.arc(cx, cy, 400, 0, Math.PI*2);
ctx.fill();
}
ctx.restore();
ctx.save();
ctx.globalAlpha = 0.2 + chaos * 0.15;
for(var i=0; i<8; i++){
var cx = W/2 + Math.cos(t*0.5 + i*0.8) * W*0.4;
var cy = H/2 + Math.sin(t*0.3 + i*1.1) * H*0.4;
ctx.strokeStyle = 'hsla('+(280+i*15)+', 100%, 60%, 0.5)';
ctx.lineWidth = 1.5;
ctx.beginPath();
for(var j=0; j<50; j++){
var tt = j/50;
var r = tt * 150;
var a = t*2 + i + tt * Math.PI * 6;
var px = cx + Math.cos(a) * r;
var py = cy + Math.sin(a) * r;
if(j===0) ctx.moveTo(px, py);
else ctx.lineTo(px, py);
}
ctx.stroke();
}
ctx.restore();
ctx.save();
for(var i=0; i<3; i++){
var cx = W/2 + Math.cos(t*0.2 + i*2) * W*0.3;
var cy = H/2 + Math.sin(t*0.25 + i*2.5) * H*0.3;
var pulse = 1 + Math.sin(state.time*0.1 + i)*0.3;
var r = 30 * pulse;
var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
g.addColorStop(0, 'rgba(255,'+(100+i*50)+',255,0.8)');
g.addColorStop(0.5, 'rgba(200,0,'+(150+i*30)+',0.4)');
g.addColorStop(1, 'transparent');
ctx.fillStyle = g;
ctx.beginPath();
ctx.arc(cx, cy, r, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#000';
ctx.beginPath();
ctx.arc(cx, cy, r*0.3, 0, Math.PI*2);
ctx.fill();
}
ctx.restore();
ctx.save();
ctx.globalAlpha = 0.3;
for(var i=0; i<100; i++){
var seed = i * 12.9898;
var x = ((Math.sin(seed) * 43758.5453) % 1 + 1) % 1 * W;
var y = ((Math.cos(seed*1.3) * 23421.631) % 1 + 1) % 1 * H;
var drift = Math.sin(state.time*0.02 + i) * 20;
var size = 2 + Math.sin(state.time*0.05 + i*0.5) * 1.5;
ctx.fillStyle = 'hsla('+(280 + (i%60))+', 100%, '+(50+Math.sin(state.time*0.1+i)*20)+'%, 0.5)';
ctx.beginPath();
ctx.arc(x + drift, y + drift*0.5, size, 0, Math.PI*2);
ctx.fill();
}
ctx.restore();
ctx.save();
ctx.globalAlpha = 0.1 + chaos * 0.1;
for(var i=0; i<5; i++){
var r = ((state.time * 2 + i * 120) % 600);
var alpha = 1 - r/600;
ctx.strokeStyle = 'rgba(200,100,255,'+(alpha*0.5)+')';
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(W/2, H/2, r, 0, Math.PI*2);
ctx.stroke();
}
ctx.restore();
}
function drawAstronomican(ox, oy){
if(!state.astronomican) return;
var ast = state.astronomican;
var sx = ast.x + ox, sy = ast.y + oy;
var drawR = ast.r;
if(sx < -drawR*3 || sx > W+drawR*3 || sy < -drawR*3 || sy > H+drawR*3) return;
ast.phase += 0.01;
var pulse = 1 + Math.sin(state.time * 0.05) * 0.08;
var g = ctx.createRadialGradient(sx, sy, 0, sx, sy, drawR * 2.5 * pulse);
g.addColorStop(0, 'rgba(255,220,100,0.6)');
g.addColorStop(0.3, 'rgba(255,180,50,0.3)');
g.addColorStop(0.6, 'rgba(255,150,0,0.15)');
g.addColorStop(1, 'rgba(255,100,0,0)');
ctx.fillStyle = g;
ctx.beginPath();
ctx.arc(sx, sy, drawR * 2.5 * pulse, 0, Math.PI*2);
ctx.fill();
ctx.save();
ctx.translate(sx, sy);
ctx.rotate(ast.phase);
if(SHADOW_ENABLED){ ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 30; }
for(var i=0; i<16; i++){
var a = (i/16) * Math.PI*2;
var len = drawR * (1.5 + Math.sin(state.time*0.1 + i)*0.3);
var grad = ctx.createLinearGradient(0, 0, Math.cos(a)*len, Math.sin(a)*len);
grad.addColorStop(0, 'rgba(255,220,100,0.8)');
grad.addColorStop(1, 'rgba(255,180,50,0)');
ctx.strokeStyle = grad;
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(0, 0);
ctx.lineTo(Math.cos(a)*len, Math.sin(a)*len);
ctx.stroke();
}
ctx.restore();
var coreG = ctx.createRadialGradient(sx, sy, 0, sx, sy, drawR * 0.6);
coreG.addColorStop(0, 'rgba(255,255,200,1)');
coreG.addColorStop(0.3, 'rgba(255,220,100,0.9)');
coreG.addColorStop(0.7, 'rgba(255,180,50,0.6)');
coreG.addColorStop(1, 'rgba(255,150,0,0)');
ctx.fillStyle = coreG;
ctx.beginPath();
ctx.arc(sx, sy, drawR * 0.6, 0, Math.PI*2);
ctx.fill();
ctx.save();
ctx.translate(sx, sy);
ctx.rotate(ast.phase * 0.3);
ctx.strokeStyle = 'rgba(255,240,180,0.7)';
ctx.lineWidth = 2;
if(SHADOW_ENABLED){ ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 15; }
for(var side=-1; side<=1; side+=2){
ctx.beginPath();
ctx.moveTo(0, 0);
ctx.quadraticCurveTo(side*drawR*0.3, -drawR*0.2, side*drawR*0.5, -drawR*0.1);
ctx.quadraticCurveTo(side*drawR*0.4, drawR*0.1, 0, 0);
ctx.stroke();
}
ctx.beginPath();
for(var i=0; i<5; i++){
var a = -Math.PI/2 + (i-2)*0.3;
var r1 = drawR * 0.25;
var r2 = drawR * 0.35;
ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
}
ctx.stroke();
ctx.restore();
ctx.shadowBlur = 0;
ctx.fillStyle = '#ffcc44';
ctx.font = 'bold 16px Courier New';
ctx.textAlign = 'center';
if(SHADOW_ENABLED){ ctx.shadowColor = '#ffcc44'; ctx.shadowBlur = 10; }
ctx.fillText('⚜ АСТРОНОМИКОН ⚜', sx, sy - drawR*1.8);
ctx.font = '11px Courier New';
ctx.fillText('СВЯЩЕННЫЙ СВЯТ · ДЕМОНЫ НЕ МОГУТ ВОЙТИ', sx, sy - drawR*1.8 + 18);
ctx.shadowBlur = 0;
}
function drawPhalanx(x, y, ph){

ctx.rotate(ph.angle);
var size = ph.size;
var pulse = 1 + Math.sin(ph.phase)*0.03;
ctx.scale(pulse, pulse);
ctx.fillStyle = '#1a2a3a';
ctx.strokeStyle = '#44aaff';
ctx.lineWidth = 3;
ctx.beginPath();
var points = 8;
for(var i=0; i<points; i++){
var a = (i/points)*Math.PI*2;
var r = size * 0.9;
if(i===0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
}
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.strokeStyle = '#2a4a6a';
ctx.lineWidth = 1;
ctx.beginPath();
for(var i=0; i<points; i++){
var a = (i/points)*Math.PI*2;
var r = size * 0.7;
if(i===0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
}
ctx.closePath();
ctx.stroke();
ctx.fillStyle = '#44aaff';

coreG.addColorStop(0.3, '#88ccff');
coreG.addColorStop(1, 'rgba(68,170,255,0)');

ctx.beginPath();

ctx.fill();
ctx.strokeStyle = '#ffcc44';
ctx.lineWidth = 2;

ctx.beginPath();
ctx.moveTo(-size*0.15, 0);
ctx.lineTo(size*0.15, 0);
ctx.moveTo(0, -size*0.15);
ctx.lineTo(0, size*0.15);

}
function drawTyranid(x, y, t){
ctx.save();
ctx.translate(x, y);
ctx.rotate(t.angle);
var size = t.size;
var pulse = 1 + Math.sin(t.phase) * 0.1;
ctx.scale(pulse, pulse);
ctx.fillStyle = t.color;
ctx.strokeStyle = t.accent;
ctx.lineWidth = 1.5;
if(SHADOW_ENABLED){ ctx.shadowColor = t.accent; ctx.shadowBlur = 8; }
ctx.beginPath();
ctx.ellipse ? ctx.ellipse(0, 0, size, size*0.7, 0, 0, Math.PI*2) : (function(){
ctx.save(); ctx.scale(1, 0.7); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.restore();
})();
ctx.fill();
ctx.stroke();
ctx.shadowBlur = 0;
ctx.fillStyle = '#2a3a1a';
ctx.beginPath();
ctx.moveTo(size*0.8, 0);
ctx.lineTo(size*1.3, -size*0.2);
ctx.lineTo(size*1.3, size*0.2);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.strokeStyle = t.accent;
ctx.lineWidth = 1.5;
for(var i=0; i<6; i++){
var side = (i < 3) ? -1 : 1;
var legIdx = i % 3;
var baseX = -size*0.3 + legIdx * size*0.4;
var baseY = side * size * 0.5;
var legAngle = Math.sin(t.legPhase + i * 0.8) * 0.4;

ctx.moveTo(baseX, baseY);
ctx.lineTo(baseX + Math.cos(legAngle + side*Math.PI/2) * size * 0.8,
baseY + Math.sin(legAngle + side*Math.PI/2) * size * 0.8);
ctx.stroke();

ctx.lineWidth = 3;
for(var cl=-1; cl<=1; cl+=2){
ctx.beginPath();
ctx.moveTo(size*0.6, cl*size*0.5);

ctx.stroke();
}
}

if(SHADOW_ENABLED){ ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 6; }
ctx.beginPath();
ctx.arc(size*0.5, -size*0.2, 2, 0, Math.PI*2);
ctx.arc(size*0.5, size*0.2, 2, 0, Math.PI*2);
ctx.fill();
ctx.shadowBlur = 0;
ctx.strokeStyle = t.accent;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(-size*0.9, 0);
ctx.lineTo(-size*1.4, Math.sin(t.phase*2)*size*0.3);
ctx.stroke();
ctx.restore();
}

})();

ctx.strokeStyle = b.accent;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.moveTo(0, 0);
ctx.lineTo(size*0.8, side*size*0.2);
ctx.lineTo(size*1.0, side*size*0.1);
ctx.lineTo(size*0.9, -side*size*0.1);
ctx.closePath();
ctx.fill();
ctx.stroke();
ctx.beginPath();
ctx.moveTo(size*1.0, side*size*0.1);
ctx.lineTo(size*1.4, side*size*0.3);
ctx.lineTo(size*1.3, side*size*0.05);
ctx.moveTo(size*1.0, side*size*0.1);
ctx.lineTo(size*1.4, -side*size*0.1);
ctx.lineTo(size*1.3, side*size*0.15);
ctx.stroke();

}
ctx.fillStyle = '#2a3a1a';
ctx.strokeStyle = b.accent;
ctx.lineWidth = 2;

ctx.moveTo(size*0.8, 0);
ctx.lineTo(size*1.3, -size*0.3);
ctx.lineTo(size*1.4, 0);
ctx.lineTo(size*1.3, size*0.3);
ctx.closePath();
ctx.fill();
ctx.stroke();

ctx.quadraticCurveTo(size*1.4, side*size*0.5, size*1.5, side*size*0.7);

ctx.fillStyle = '#ff4444';
if(SHADOW_ENABLED){ ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8; }

ctx.fill();
}
ctx.shadowBlur = 0;
ctx.strokeStyle = b.accent;
ctx.lineWidth = 3;
for(var i=0; i<8; i++){

for(var i=0; i<layer.length; i++){
var s = layer[i];
var px = s.x - cx*s.speed + W/2 + shakeX*(1-s.speed);
var py = s.y - cy*s.speed + H/2 + shakeY*(1-s.speed);
if(px<-10 || px>W+10 || py<-10 || py>H+10) continue;
var twinkle = 0.7 + Math.sin(state.time*0.05 + s.twinkle) * 0.3;
var alpha = s.bright * twinkle;
var colors = ['200,255,200', '255,220,180', '180,220,255', '255,200,200'];
var col = colors[Math.floor(s.twinkle) % colors.length];
ctx.fillStyle = 'rgba('+col+','+alpha+')';

if(s.size > 1.5){
ctx.globalAlpha = alpha * 0.3;
ctx.fillStyle = 'rgba('+col+',0.5)';
ctx.beginPath();
ctx.arc(px, py, s.size*2, 0, Math.PI*2);
ctx.fill();
ctx.globalAlpha = 1;
}
}
}
} else {

var px = W/2 + Math.cos(angle + spiral*0.01) * (radius + warpNoise);
var py = H/2 + Math.sin(angle + spiral*0.01) * (radius + warpNoise);
var flick = 0.3 + Math.sin(state.time*0.15 + i)*0.3;
var hue = (i * 3 + state.time) % 360;
ctx.fillStyle = 'hsla('+(280 + (hue%60))+', 100%, '+(50+flick*30)+'%, '+flick+')';
ctx.fillRect(px, py, 2 + state.warpChaosLevel, 2 + state.warpChaosLevel);

}
if(!state.warpMode){

for(var i=0; i<state.rifts.length; i++){

}
ctx.fillStyle = '#44ff44';
ctx.fillRect(x+size/2 + state.player.x*scale - 2, y+size/2 + state.player.y*scale - 2, 4, 4);
if(state.secretShip && state.secretShip.found && !state.warpMode){
ctx.fillStyle = '#ffcc00';
ctx.beginPath(); ctx.arc(x+size/2 + state.secretShip.x*scale, y+size/2 + state.secretShip.y*scale, 5, 0, Math.PI*2); ctx.fill();
}
ctx.fillStyle = '#44ff44'; ctx.font = '10px Courier New'; ctx.textAlign = 'left';
ctx.fillText('МАТЕРИУМ [M]', x+4, y+size-4);
}
}
function drawMap(){
var size = Math.min(W,H) - 40, x = (W-size)/2, y = (H-size)/2;
ctx.fillStyle = 'rgba(0,15,0,0.95)'; ctx.fillRect(x,y,size,size);
ctx.strokeStyle = '#44ff44'; ctx.lineWidth = 2; ctx.strokeRect(x,y,size,size);
if(state.warpMode){
var scale = size / (WARP_WORLD*2);
ctx.fillStyle = '#ff44ff'; ctx.font = 'bold 18px Courier New'; ctx.textAlign = 'center';
ctx.fillText('ВАРП-ПРОСТРАНСТВО', W/2, y+25);
for(var i=0; i<state.rifts.length; i++){
var r = state.rifts[i];
var rx = (r.x / WARP_SCALE) * scale;
var ry = (r.y / WARP_SCALE) * scale;
ctx.fillStyle = '#ff00ff';
ctx.beginPath();
ctx.arc(x+size/2 + rx, y+size/2 + ry, 6, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#ff00ff'; ctx.font = '9px Courier New';
ctx.fillText('ЯКОРЬ', x+size/2 + rx, y+size/2 + ry + 15);
}
if(state.eyeOfTerror){
var ex = (state.eyeOfTerror.x / WARP_SCALE) * scale;
var ey = (state.eyeOfTerror.y / WARP_SCALE) * scale;
ctx.fillStyle = '#ff00aa';
ctx.beginPath();
ctx.arc(x+size/2 + ex, y+size/2 + ey, 10, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#ff00aa'; ctx.font = '10px Courier New';
ctx.fillText('ЭПИЦЕНТР', x+size/2 + ex, y+size/2 + ey + 20);
}
if(state.astronomican){
var ax = (state.astronomican.x) * scale;
var ay = (state.astronomican.y) * scale;
ctx.fillStyle = '#ffcc44';
ctx.beginPath();
ctx.arc(x+size/2 + ax, y+size/2 + ay, 8, 0, Math.PI*2);
ctx.fill();
ctx.fillStyle = '#ffcc44'; ctx.font = '10px Courier New';
ctx.fillText('АСТРОНОМИКОН', x+size/2 + ax, y+size/2 + ay + 18);
}
for(var i=0; i<state.warpEntities.length; i++){
var e = state.warpEntities[i];
if(!e.alive) continue;
ctx.fillStyle = '#ff44ff';
ctx.beginPath(); ctx.arc(x+size/2 + e.x*scale, y+size/2 + e.y*scale, 4, 0, Math.PI*2); ctx.fill();
}
for(var i=0; i<state.warpDemons.length; i++){
var e = state.warpDemons[i];
if(!e.alive || !e.inWarp) continue;
ctx.fillStyle = '#ff4444';
ctx.beginPath(); ctx.arc(x+size/2 + e.x*scale, y+size/2 + e.y*scale, 3, 0, Math.PI*2); ctx.fill();
}
for(var i=0; i<state.warpVortices.length; i++){
var v = state.warpVortices[i];
ctx.fillStyle = '#aa44ff';
ctx.beginPath(); ctx.arc(x+size/2 + v.x*scale, y+size/2 + v.y*scale, 6, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#aa44ff'; ctx.font = '8px Courier New';
ctx.fillText('ВИХРЬ', x+size/2 + v.x*scale, y+size/2 + v.y*scale + 14);
}
for(var i=0; i<state.warpGhosts.length; i++){
var g = state.warpGhosts[i];
if(!g.alive) continue;
ctx.fillStyle = '#cc88ff';
ctx.beginPath(); ctx.arc(x+size/2 + g.x*scale, y+size/2 + g.y*scale, 4, 0, Math.PI*2); ctx.fill();
}
ctx.fillStyle = '#44ff44';
ctx.fillRect(x+size/2 + state.player.x*scale - 3, y+size/2 + state.player.y*scale - 3, 6, 6);
} else {
var scale = size / (WORLD*2);
ctx.fillStyle = '#44ff44'; ctx.font = 'bold 18px Courier New'; ctx.textAlign = 'center';
ctx.fillText('КАРТА СЕКТОРА', W/2, y+25);
for(var i=0; i<state.nebulae.length; i++){
var n = state.nebulae[i];
ctx.fillStyle = n.color;
ctx.beginPath(); ctx.arc(x+size/2 + n.x*scale, y+size/2 + n.y*scale, n.r*scale, 0, Math.PI*2); ctx.fill();
}
for(var i=0; i<state.gravityWells.length; i++){
var gw = state.gravityWells[i];
ctx.fillStyle = '#aa88ff';
ctx.beginPath(); ctx.arc(x+size/2 + gw.x*scale, y+size/2 + gw.y*scale, 6, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#aa88ff'; ctx.font = '9px Courier New';
ctx.fillText('ГРАВ', x+size/2 + gw.x*scale, y+size/2 + gw.y*scale + 15);
}
for(var i=0; i<state.asteroidFields.length; i++){
var field = state.asteroidFields[i];
ctx.strokeStyle = '#888'; ctx.lineWidth = 1;
ctx.beginPath(); ctx.arc(x+size/2 + field.x*scale, y+size/2 + field.y*scale, field.r*scale, 0, Math.PI*2); ctx.stroke();
}
for(var i=0; i<state.planets.length; i++){
var pl = state.planets[i];
var col = '#2a5a2a';
var ownerText = pl.name;
if(pl.owner === 'imperium'){ col = '#44aaff'; ownerText = pl.name + ' [ИМПЕРИУМ]'; }
else if(pl.owner === 'chaos'){ col = '#ff4444'; ownerText = pl.name + ' [ХАОС]'; }
ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x+size/2 + pl.x*scale, y+size/2 + pl.y*scale, 4, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#88ff88'; ctx.font = '10px Courier New';
ctx.fillText(ownerText, x+size/2 + pl.x*scale, y+size/2 + pl.y*scale + 14);
}
for(var i=0; i<state.rifts.length; i++){
var r = state.rifts[i];
ctx.fillStyle = '#ff88ff';
ctx.beginPath(); ctx.arc(x+size/2 + r.x*scale, y+size/2 + r.y*scale, 6, 0, Math.PI*2); ctx.fill();
}
if(state.eyeOfTerror){
ctx.fillStyle = '#ff4444';
ctx.beginPath(); ctx.arc(x+size/2 + state.eyeOfTerror.x*scale, y+size/2 + state.eyeOfTerror.y*scale, 10, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#ff4444'; ctx.font = '10px Courier New';
ctx.fillText('ОКО УЖАСА', x+size/2 + state.eyeOfTerror.x*scale, y+size/2 + state.eyeOfTerror.y*scale + 20);
}
for(var i=0; i<state.enemies.length; i++){
var e = state.enemies[i];
if(!e.alive) continue;
var col = e.type === 'battleship' ? '#ff0000' : (e.type === 'hellbringer' ? '#ff4400' : '#ff6666');
ctx.fillStyle = col; ctx.fillRect(x+size/2 + e.x*scale - 2, y+size/2 + e.y*scale - 2, 4, 4);
}
for(var i=0; i<state.warpDemons.length; i++){
var e = state.warpDemons[i];
if(!e.alive || e.inWarp) continue;
ctx.fillStyle = '#ff2222'; ctx.fillRect(x+size/2 + e.x*scale - 2, y+size/2 + e.y*scale - 2, 4, 4);
}
for(var i=0; i<state.allies.length; i++){
var ally = state.allies[i];
if(!ally.alive) continue;
ctx.fillStyle = '#44aaff';
ctx.beginPath(); ctx.arc(x+size/2 + ally.x*scale, y+size/2 + ally.y*scale, 4, 0, Math.PI*2); ctx.fill();
}
for(var i=0; i<state.bosses.length; i++){
var boss = state.bosses[i];
if(!boss.alive) continue;
ctx.fillStyle = '#ff00ff';
ctx.beginPath(); ctx.arc(x+size/2 + boss.x*scale, y+size/2 + boss.y*scale, 8, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#ff00ff'; ctx.font = '10px Courier New';
ctx.fillText(boss.name, x+size/2 + boss.x*scale, y+size/2 + boss.y*scale + 18);
}
for(var i=0; i<state.crusadeShips.length; i++){
var cs = state.crusadeShips[i];
if(!cs.alive) continue;
ctx.fillStyle = cs.faction === 'imperium' ? '#44aaff' : '#ff4444';
ctx.beginPath(); ctx.arc(x+size/2 + cs.x*scale, y+size/2 + cs.y*scale, 5, 0, Math.PI*2); ctx.fill();
}
for(var i=0; i<state.patrolShips.length; i++){
var ps = state.patrolShips[i];
if(!ps.alive) continue;
ctx.fillStyle = ps.faction === 'imperium' ? '#44aaff' : '#ff4444';
ctx.beginPath(); ctx.arc(x+size/2 + ps.x*scale, y+size/2 + ps.y*scale, 4, 0, Math.PI*2); ctx.fill();
}
for(var i=0; i<state.wanderers.length; i++){
var w = state.wanderers[i];
if(!w.alive) continue;
ctx.fillStyle = '#ffcc44';
ctx.beginPath(); ctx.arc(x+size/2 + w.x*scale, y+size/2 + w.y*scale, 6, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#ffcc44'; ctx.font = '10px Courier New';
ctx.fillText('СКЕТАЛЕЦ', x+size/2 + w.x*scale, y+size/2 + w.y*scale + 18);
}
if(state.phalanx && state.phalanx.alive){
ctx.fillStyle = '#44aaff';
ctx.beginPath(); ctx.arc(x+size/2 + state.phalanx.x*scale, y+size/2 + state.phalanx.y*scale, 8, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#44aaff'; ctx.font = '10px Courier New';
ctx.fillText('ФАЛАНГА', x+size/2 + state.phalanx.x*scale, y+size/2 + state.phalanx.y*scale + 18);
}
for(var i=0; i<state.tyranids.length; i++){
var t = state.tyranids[i];
if(!t.alive) continue;
ctx.fillStyle = '#88aa44';
ctx.fillRect(x+size/2 + t.x*scale - 1, y+size/2 + t.y*scale - 1, 3, 3);
}
for(var i=0; i<state.tyranidBosses.length; i++){
var b = state.tyranidBosses[i];
if(!b.alive) continue;
ctx.fillStyle = '#aacc44';
ctx.beginPath(); ctx.arc(x+size/2 + b.x*scale, y+size/2 + b.y*scale, 6, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#aacc44'; ctx.font = '10px Courier New';
ctx.fillText('ТИРАНОД-УЖАС', x+size/2 + b.x*scale, y+size/2 + b.y*scale + 18);
}
ctx.fillStyle = '#44ff44';
ctx.fillRect(x+size/2 + state.player.x*scale - 3, y+size/2 + state.player.y*scale - 3, 6, 6);
if(state.secretShip && state.secretShip.found && !state.warpMode){
ctx.fillStyle = '#ffcc00';
ctx.beginPath(); ctx.arc(x+size/2 + state.secretShip.x*scale, y+size/2 + state.secretShip.y*scale, 8, 0, Math.PI*2); ctx.fill();
ctx.fillStyle = '#ffcc00'; ctx.font = '10px Courier New';
ctx.fillText('ДИМА ТИТЬКИН', x+size/2 + state.secretShip.x*scale, y+size/2 + state.secretShip.y*scale + 18);
}
}
ctx.fillStyle = '#88ff88'; ctx.font = '12px Courier New'; ctx.textAlign = 'center';
ctx.fillText('Нажмите M чтобы закрыть', W/2, y+size-15);
}
function updateUI(){
if(!state.player) return;
var p = state.player;
var mode = state.warpMode ? '<span style="color:#ff44ff">ВАРП</span>' : '<span style="color:#44ff44">МАТЕРИУМ</span>';
var energyPct = (p.energy / p.maxEnergy) * 100;
var energyColor = energyPct > 60 ? '#44ff44' : (energyPct > 30 ? '#ffaa44' : '#ff4444');
var hpPct = (p.hp / p.maxHp) * 100;
var hpColor = hpPct > 50 ? '#44ff44' : (hpPct > 25 ? '#ffaa44' : '#ff4444');
var energyBar = '';
for(var i=0; i<Math.floor(energyPct/5); i++) energyBar += '█';
for(var i=Math.floor(energyPct/5); i<20; i++) energyBar += '░';
var hpBar = '';
for(var i=0; i<Math.floor(hpPct/5); i++) hpBar += '█';
for(var i=Math.floor(hpPct/5); i<20; i++) hpBar += '░';
var warpStatus = '';
if(state.warpMode){
warpStatus = p.energy >= 40 && p.warpCooldown === 0
? '<span style="color:#44ff44">[Q] ВЫЙТИ ИЗ ВАРПА (40 энергии)</span>'
: '<span style="color:#666">[Q] нужно 40 энергии</span>';
} else {
var nearRift = false;
for(var i=0; i<state.rifts.length; i++){
var r = state.rifts[i];
if(dist(p, r) < r.r + 50){ nearRift = true; break; }
}
var baseCost = nearRift ? 0 : 60;
var cost = Math.floor(baseCost * (p.warpCostMult || 1));
warpStatus = p.energy >= cost && p.warpCooldown === 0
? (nearRift ? '<span style="color:#44ff44">[Q] ВАРП-ПРЫЖОК (бесплатно через разлом)</span>' : '<span style="color:#44ff44">[Q] ВАРП-ПРЫЖОК ('+cost+' энергии)</span>')
: '<span style="color:#666">[Q] нужно '+cost+' энергии</span>';
}
var weatherNames = {
'clear': '<span style="color:#88ff88">☀ ЯСНО</span>',
'solar_storm': '<span style="color:#ffcc44">⚡ СОЛНЕЧНАЯ БУРЯ</span>',
'warp_storm': '<span style="color:#aa88ff">🌀 ВАРП-ШТОРМ</span>',
'nebula_fog': '<span style="color:#8888aa">🌫 ТУМАННОСТЬ</span>'
};
var weatherStr = weatherNames[state.weather] || weatherNames['clear'];
var bossWarning = '';
if(state.bosses.length > 0){
bossWarning = '<span style="color:#ff00ff">⚠ БОСС: '+state.bosses[0].name+'</span>';
} else if(state.tyranidBosses.length > 0){
bossWarning = '<span style="color:#aacc44">⚠ ТИРАНОД-УЖАС</span>';
}
var captureStatus = '';
if(p.captureTimer > 0){
captureStatus = '<span style="color:#44aaff">⚡ ЗАХВАТ: '+Math.floor(p.captureTimer/180*100)+'%</span>';
}
var crusadeStatus = '';
if(state.crusade.active){
var name = state.crusade.faction === 'imperium' ? 'КРЕСТОВЫЙ ПОХОД' : 'ЧЁРНЫЙ КРЕСТОВЫЙ ПОХОД';
var color = state.crusade.faction === 'imperium' ? '#44aaff' : '#ff4444';
var remaining = state.crusadeShips.filter(function(cs){return cs.alive && !cs.isDimasShip;}).length;
crusadeStatus = '<span style="color:'+color+'">⚔ '+name+' · флот: '+remaining+'</span>';
}
var impCount = 0, chaosCount = 0, neutralCount = 0;
for(var i=0; i<state.planets.length; i++){
var pl = state.planets[i];
if(pl.owner === 'imperium') impCount++;
else if(pl.owner === 'chaos') chaosCount++;
else neutralCount++;
}
var planetStats = '<span style="color:#666">Планеты: Имп '+impCount+' · Хаос '+chaosCount+' · Нейтр '+neutralCount+'</span>';
var warpChaosStatus = '';
if(state.warpMode){
var chaosPct = Math.floor(state.warpChaosLevel * 100);
var chaosColor = state.warpChaosLevel > 0.7 ? '#ff0044' : (state.warpChaosLevel > 0.4 ? '#ff44aa' : '#aa44ff');
warpChaosStatus = '<span style="color:'+chaosColor+'">🌀 ХАОС: '+chaosPct+'%</span>';
}
var techStatus = '';
if(state.eyeOfTerrorTechGiven){
techStatus = '<span style="color:#ffcc44">★ СЕКРЕТНАЯ ТЕХНОЛОГИЯ (x2 скорость)</span>';
}
var demonStatus = '';
if(state.blackstoneFortressKilled){
demonStatus = '<span style="color:#ff4444">☠ ДЕМОНЫ ОКА УЖАСА БЕССМЕРТНЫ</span>';
}
var phalanxStatus = '';
if(state.phalanx && state.phalanx.alive){
phalanxStatus = '<span style="color:#44aaff">⚜ ФАЛАНГА</span>';
}
var dimasStatus = '';
if(state.secretShip && state.secretShip.found){
dimasStatus = '<span style="color:#ffcc00">★ ДИМА ТИТЬКИН</span>';
}
var storyModeLabel = state.storyMode ? '<span style="color:#ffcc44">◈ СЮЖЕТ</span> · ' : '';
var resurrectCd = '';
if(state.storyMode && state.storyResurrectCd > 0){
resurrectCd = '<br><span style="color:#666">Телепорт КД: '+Math.ceil(state.storyResurrectCd/60)+'с</span>';
}
ui.innerHTML =
storyModeLabel+'<b>КОРАБЛЬ ИМПЕРИИ</b> · '+mode+'<br>'+
'Корпус: <b style="color:'+hpColor+'">'+Math.floor(p.hp)+'/'+p.maxHp+'</b><br>'+
'<span style="color:'+hpColor+'; font-family:monospace">'+hpBar+'</span><br>'+
'Энергия: <b style="color:'+energyColor+'">'+Math.floor(p.energy)+'/'+p.maxEnergy+'</b><br>'+
'<span style="color:'+energyColor+'; font-family:monospace">'+energyBar+'</span><br>'+
(p.maxShield > 0 ? 'Щит: <b style="color:#4488ff">'+Math.floor(p.shield)+'/'+p.maxShield+'</b><br>' : '')+
'Убито: <b style="color:#88ff88">'+state.kills+'</b> · Боссов: <b style="color:#ff00ff">'+state.bossesKilled+'</b><br>'+
'Погода: '+weatherStr+'<br>'+
planetStats+'<br>'+
bossWarning+
captureStatus+
crusadeStatus+
warpChaosStatus+
techStatus+
demonStatus+
phalanxStatus+
dimasStatus+
warpStatus+
resurrectCd;
}
function init(){
genStars();
genPlanets();
genRifts();
genNebulae();
genEyeOfTerror();
genAnomalies();
state.player = createPlayer();
spawnAllies();
spawnEnemies();
var terra = null;
for(var i=0; i<state.planets.length; i++){
if(state.planets[i].isTerra){ terra = state.planets[i]; break; }
}
if(terra) {
for(var i=0; i<3; i++) {
var patrol = makePatrolShip(terra, 'imperium');
terra.patrolShip = patrol;
state.patrolShips.push(patrol);
}
}
if(terra){
state.astronomican = {
x: terra.x / WARP_SCALE,
y: terra.y / WARP_SCALE,
r: 250,
phase: 0
};
}
var wx, wy;
do {
wx = rand(-WORLD*0.8, WORLD*0.8);
wy = rand(-WORLD*0.8, WORLD*0.8);
} while(Math.hypot(wx, wy) < 4000);
state.wanderers.push(makeWanderer(wx, wy));
state.tyranidSpawnTimer = 600;
state.tyranidBossTimer = 1800;
var nonTerraPlanets = [];
for(var i=0; i<state.planets.length; i++){
if(!state.planets[i].isTerra) nonTerraPlanets.push(i);
}
var secretPlanetIdx = nonTerraPlanets[Math.floor(Math.random() * nonTerraPlanets.length)];
var secretPlanet = state.planets[secretPlanetIdx];
var secAngle = Math.random() * Math.PI * 2;
var secDist = secretPlanet.r + 150;
state.secretShip = {
x: secretPlanet.x + Math.cos(secAngle) * secDist,
y: secretPlanet.y + Math.sin(secAngle) * secDist,
found: false,
spawnTimer: 3600,
hp: 5000,
maxHp: 5000,
shield: 2000,
maxShield: 2000,
size: 60,
angle: 0,
phase: 0
};
}
init();
var rafId;
function loop(){
state.time++;
update();
draw();
rafId = requestAnimationFrame(loop);
}
loop();
document.addEventListener('visibilitychange', function(){
if(document.hidden){
if(rafId) cancelAnimationFrame(rafId);
} else {
rafId = requestAnimationFrame(loop);
}
});
})();
</script>
</body>
</html>
